#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

stages:
  - test

# Test commands live in ci/test-server.sh and ci/test-client.sh.
# Domain engineers edit those scripts to wire in real tests; this YAML should
# not need changes.

test_server:
  stage: test
  image: gradle:8-jdk21
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  script:
    - sh ./ci/test-server.sh
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  artifacts:
    when: always
    reports:
      junit: server/build/test-results/test/**/TEST-*.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

test_client:
  stage: test
  image: node:20
  script:
    - sh ./ci/test-client.sh
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules
  artifacts:
    when: always
    reports:
      junit: client/test-results/**/junit*.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

name: Docker

# Publishes the images of the server and the client to the GitHub Container Registry on a version tag (v1.2.3), for amd64 and arm64:
#   ghcr.io/lbdudc/linea-server   ghcr.io/lbdudc/linea-client
# They carry the official plugins (lbdudc/linea-plugins) and the metamodels (lbdudc/linea-metamodels) at the tag's moment.
# Docker Hub: set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to push there too.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: lbdudc

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: linea-server
            file: apps/server/Dockerfile
            contexts: |
              plugins=_deps/linea-plugins
              metamodels=_deps/linea-metamodels
          - name: linea-client
            file: apps/client/Dockerfile
            contexts: |
              plugins=_deps/linea-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lbdudc/linea-plugins
          path: _deps/linea-plugins
      - uses: actions/checkout@v4
        with:
          repository: lbdudc/linea-metamodels
          path: _deps/linea-metamodels
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
            ${{ vars.DOCKERHUB_ENABLED == 'true' && format('{0}/{1}', env.OWNER, matrix.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.contexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

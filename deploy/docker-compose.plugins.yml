# The plugins that run as a service of their own, on LINEA's network. Use it together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.plugins.yml up -d --build
#
# (without it LINEA runs, and the plugins that need these services show as "down" in Configuration → Plugins)
services:
  # analytics-plugin: the analysis of feature models, flamapy in a service of its own
  flamapy-server:
    image: ghcr.io/lbdudc/linea-flamapy:${LINEA_VERSION:-latest}
    build:
      context: ${LINEA_PLUGINS_SRC:-../../linea-plugins}/analytics-plugin/service
    networks:
      - linea-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    depends_on:
      flamapy-server:
        condition: service_healthy
